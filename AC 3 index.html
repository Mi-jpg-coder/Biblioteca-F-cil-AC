<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Biblioteca Fácil</title>

    <style>

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

            font-family: Arial, sans-serif;

        }

        body {

            background: #f5f0ff;

            color: #302344;

            min-height: 100vh;

        }

        .cabecalho {

            background: #6d45a5;

            color: white;

            padding: 25px 8%;

        }

        .marca {

            display: flex;

            align-items: center;

            gap: 15px;

        }

        .icone {

            font-size: 38px;

        }

        .marca h1 {

            font-size: 27px;

            margin-bottom: 5px;

        }

        .marca p {

            font-size: 14px;

            opacity: 0.9;

        }

        .container {

            width: 90%;

            max-width: 950px;

            margin: 35px auto;

        }

        .painel {

            background: white;

            padding: 28px;

            border-radius: 15px;

            box-shadow: 0 4px 18px rgba(60, 30, 90, 0.08);

            margin-bottom: 25px;

        }

        h2 {

            color: #633b9b;

            margin-bottom: 22px;

            font-size: 22px;

        }

        .campo {

            margin-bottom: 18px;

        }

        label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            color: #49345f;

        }

        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #d8c9eb;

            border-radius: 8px;

            font-size: 15px;

            outline: none;

            background: white;

        }

        input:focus {

            border-color: #8055b8;

            box-shadow: 0 0 0 2px #eee4fa;

        }

        .botoes {

            display: flex;

            gap: 10px;

            flex-wrap: wrap;

        }

        button {

            border: none;

            border-radius: 8px;

            padding: 12px 20px;

            cursor: pointer;

            font-size: 14px;

            font-weight: bold;

        }

        .botao-salvar {

            background: #7046a8;

            color: white;

        }

        .botao-cancelar {

            background: #e8e0f1;

            color: #513477;

        }

        .botao-editar {

            background: #eee5fa;

            color: #603b91;

        }

        .botao-excluir {

            background: #ffe8e8;

            color: #bd3434;

        }

        button:hover {

            opacity: 0.85;

        }

        .mensagem {

            margin-top: 15px;

            font-size: 14px;

        }

        .cabecalho-lista {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;

        }

        .cabecalho-lista h2 {

            margin: 0;

        }

        .contador {

            background: #eee4fa;

            color: #633b9b;

            padding: 8px 13px;

            border-radius: 20px;

            font-weight: bold;

        }

        .pesquisa {

            background: #faf7ff;

            border: 1px solid #e3d8f1;

            border-radius: 12px;

            padding: 18px;

            margin-bottom: 22px;

        }

        .pesquisa label {

            color: #633b9b;

        }

        .livro-item {

            display: flex;

            align-items: center;

            gap: 18px;

            padding: 18px;

            border: 1px solid #eee5f6;

            border-radius: 12px;

            margin-bottom: 13px;

            background: white;

        }

        .capa {

            width: 60px;

            height: 75px;

            background: #eee4fa;

            border-radius: 8px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 28px;

            flex-shrink: 0;

        }

        .informacoes {

            flex: 1;

        }

        .informacoes h3 {

            color: #56347e;

            margin-bottom: 7px;

        }

        .informacoes p {

            color: #746783;

            margin-bottom: 7px;

        }

        .ano-livro {

            color: #8a7b99;

            font-size: 13px;

        }

        .acoes {

            display: flex;

            gap: 8px;

            margin-top: 12px;

            flex-wrap: wrap;

        }

        .vazio {

            text-align: center;

            padding: 35px 15px;

            color: #83758f;

        }

        .emoji {

            font-size: 35px;

            margin-bottom: 12px;

        }

        @media (max-width: 600px) {

            .cabecalho {

                padding: 20px;

            }

            .container {

                width: 94%;

                margin: 20px auto;

            }

            .painel {

                padding: 20px;

            }

            .livro-item {

                align-items: flex-start;

            }

        }

    </style>

</head>

<body>

    <header class="cabecalho">

        <div class="marca">

            <div class="icone">📚</div>

            <div>

                <h1>Biblioteca Fácil</h1>

                <p>Organize seus livros de forma simples</p>

            </div>

        </div>

    </header>

    <main class="container">

        <!-- FORMULÁRIO DE CADASTRO -->

        <section class="painel">

            <h2 id="tituloFormulario">Cadastrar livro</h2>

            <form id="formLivro">

                <div class="campo">

                    <label for="titulo">Título do livro</label>

                    <input

                        type="text"

                        id="titulo"

                        placeholder="Digite o título do livro"

                        required

                    >

                </div>

                <div class="campo">

                    <label for="autor">Autor</label>

                    <input

                        type="text"

                        id="autor"

                        placeholder="Digite o nome do autor"

                        required

                    >

                </div>

                <div class="campo">

                    <label for="ano">Ano de publicação</label>

                    <input

                        type="number"

                        id="ano"

                        placeholder="Exemplo: 2024"

                    >

                </div>

                <div class="botoes">

                    <button

                        type="submit"

                        class="botao-salvar"

                        id="botaoSalvar"

                    >

                        Salvar livro

                    </button>

                    <button

                        type="button"

                        class="botao-cancelar"

                        id="botaoCancelar"

                        hidden

                    >

                        Cancelar

                    </button>

                </div>

            </form>

            <p class="mensagem" id="mensagem"></p>

        </section>

        <!-- LISTA E PESQUISA -->

        <section class="painel">

            <div class="cabecalho-lista">

                <h2>Meus livros</h2>

                <span class="contador" id="contador">0 livros</span>

            </div>

            <!-- CAMPO DE PESQUISA -->

            <div class="pesquisa">

                <label for="pesquisaLivro">

                    🔎 Pesquisar livro ou autor

                </label>

                <input

                    type="search"

                    id="pesquisaLivro"

                    placeholder="Digite o título ou nome do autor..."

                    autocomplete="off"

                >

            </div>

            <div id="listaLivros">

                <div class="vazio">Carregando livros...</div>

            </div>

        </section>

    </main>

    <script>

        // ELEMENTOS DA PÁGINA

        const formulario = document.getElementById("formLivro");

        const campoTitulo = document.getElementById("titulo");

        const campoAutor = document.getElementById("autor");

        const campoAno = document.getElementById("ano");

        const pesquisaLivro = document.getElementById("pesquisaLivro");

        const listaLivros = document.getElementById("listaLivros");

        const contador = document.getElementById("contador");

        const mensagem = document.getElementById("mensagem");

        const botaoSalvar = document.getElementById("botaoSalvar");

        const botaoCancelar = document.getElementById("botaoCancelar");

        const tituloFormulario = document.getElementById("tituloFormulario");

        let idEditando = null;

        let temporizadorPesquisa = null;

        // MOSTRAR MENSAGENS

        function mostrarMensagem(texto, erro = false) {

            mensagem.textContent = texto;

            mensagem.style.color = erro

                ? "#bd3434"

                : "#27804a";

            setTimeout(function() {

                mensagem.textContent = "";

            }, 4000);

        }

        // CARREGAR E PESQUISAR LIVROS

        async function carregarLivros() {

            try {

                const termo = pesquisaLivro.value.trim();

                let url = "/livros";

                if (termo !== "") {

                    url = "/pesquisar?q=" + encodeURIComponent(termo);

                }

                const resposta = await fetch(url);

                if (!resposta.ok) {

                    throw new Error("Não foi possível carregar os livros.");

                }

                const livros = await resposta.json();

                listaLivros.replaceChildren();

                contador.textContent =

                    livros.length +

                    (livros.length === 1 ? " livro" : " livros");

                if (livros.length === 0) {

                    const vazio = document.createElement("div");

                    vazio.className = "vazio";

                    const emoji = document.createElement("div");

                    emoji.className = "emoji";

                    emoji.textContent = "📚";

                    const texto = document.createElement("p");

                    texto.textContent = termo

                        ? "Nenhum livro encontrado. Tente outro título ou autor."

                        : "Sua biblioteca está vazia. Cadastre seu primeiro livro!";

                    vazio.append(emoji, texto);

                    listaLivros.appendChild(vazio);

                    return;

                }

                livros.forEach(function(livro) {

                    const cartao = document.createElement("article");

                    cartao.className = "livro-item";

                    const capa = document.createElement("div");

                    capa.className = "capa";

                    capa.textContent = "📖";

                    const informacoes = document.createElement("div");

                    informacoes.className = "informacoes";

                    const titulo = document.createElement("h3");

                    titulo.textContent = livro.titulo;

                    const autor = document.createElement("p");

                    autor.textContent = "Autor: " + livro.autor;

                    const ano = document.createElement("span");

                    ano.className = "ano-livro";

                    ano.textContent = livro.ano

                        ? "Ano de publicação: " + livro.ano

                        : "Ano não informado";

                    const acoes = document.createElement("div");

                    acoes.className = "acoes";

                    const editar = document.createElement("button");

                    editar.type = "button";

                    editar.className = "botao-editar";

                    editar.textContent = "Editar";

                    editar.addEventListener("click", function() {

                        iniciarEdicao(livro);

                    });

                    const excluir = document.createElement("button");

                    excluir.type = "button";

                    excluir.className = "botao-excluir";

                    excluir.textContent = "Excluir";

                    excluir.addEventListener("click", function() {

                        excluirLivro(livro.id);

                    });

                    acoes.append(editar, excluir);

                    informacoes.append(

                        titulo,

                        autor,

                        ano,

                        acoes

                    );

                    cartao.append(capa, informacoes);

                    listaLivros.appendChild(cartao);

                });

            } catch (erro) {

                listaLivros.replaceChildren();

                const aviso = document.createElement("div");

                aviso.className = "vazio";

                aviso.textContent = erro.message;

                listaLivros.appendChild(aviso);

                mostrarMensagem(erro.message, true);

            }

        }

        // PESQUISAR AUTOMATICAMENTE ENQUANTO DIGITA

        pesquisaLivro.addEventListener("input", function() {

            clearTimeout(temporizadorPesquisa);

            temporizadorPesquisa = setTimeout(function() {

                carregarLivros();

            }, 250);

        });

        // CADASTRAR OU ATUALIZAR LIVRO

        formulario.addEventListener("submit", async function(evento) {

            evento.preventDefault();

            const dados = {

                titulo: campoTitulo.value.trim(),

                autor: campoAutor.value.trim(),

                ano: campoAno.value.trim() === ""

                    ? null

                    : Number(campoAno.value)

            };

            const editando = idEditando !== null;

            const url = editando

                ? "/livros/" + idEditando

                : "/livros";

            try {

                const resposta = await fetch(url, {

                    method: editando ? "PUT" : "POST",

                    headers: {

                        "Content-Type": "application/json"

                    },

                    body: JSON.stringify(dados)

                });

                const resultado = await resposta.json();

                if (!resposta.ok) {

                    throw new Error(

                        resultado.erro || "Erro ao salvar livro."

                    );

                }

                mostrarMensagem(

                    editando

                        ? "Livro atualizado com sucesso!"

                        : "Livro cadastrado com sucesso!"

                );

                limparFormulario();

                await carregarLivros();

            } catch (erro) {

                mostrarMensagem(erro.message, true);

            }

        });

        // EDITAR LIVRO

        function iniciarEdicao(livro) {

            idEditando = livro.id;

            campoTitulo.value = livro.titulo;

            campoAutor.value = livro.autor;

            campoAno.value = livro.ano || "";

            tituloFormulario.textContent = "Editar livro";

            botaoSalvar.textContent = "Atualizar livro";

            botaoCancelar.hidden = false;

            formulario.scrollIntoView({

                behavior: "smooth"

            });

        }

        // LIMPAR FORMULÁRIO

        function limparFormulario() {

            formulario.reset();

            idEditando = null;

            tituloFormulario.textContent = "Cadastrar livro";

            botaoSalvar.textContent = "Salvar livro";

            botaoCancelar.hidden = true;

        }

        // CANCELAR EDIÇÃO

        botaoCancelar.addEventListener("click", function() {

            limparFormulario();

            mostrarMensagem("Edição cancelada.");

        });

        // EXCLUIR LIVRO

        async function excluirLivro(id) {

            const confirmar = confirm(

                "Tem certeza que deseja excluir este livro?"

            );

            if (!confirmar) {

                return;

            }

            try {

                const resposta = await fetch("/livros/" + id, {

                    method: "DELETE"

                });

                const resultado = await resposta.json();

                if (!resposta.ok) {

                    throw new Error(

                        resultado.erro || "Erro ao excluir livro."

                    );

                }

                mostrarMensagem("Livro excluído com sucesso!");

                await carregarLivros();

            } catch (erro) {

                mostrarMensagem(erro.message, true);

            }

        }

        // INICIAR A BIBLIOTECA

        carregarLivros();

    </script>

</body>

</html>
